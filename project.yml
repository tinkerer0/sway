name: Sway
options:
  bundleIdPrefix: com.tinkerer0
  deploymentTarget:
    iOS: '17.0'
packages:
  MusicCore:
    path: .
  YouTubeKit:
    path: Vendor/YouTubeKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Sway:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: MusicCore
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkerer0.solomusic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sway
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '25'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sway
        UIBackgroundModes: [audio]
        UIAppFonts: [Galmuri11.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
  SwayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Sway
      - package: MusicCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkerer0.solomusic.tests
  SwayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Sway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tinkerer0.solomusic.uitests
schemes:
  Sway:
    build:
      targets:
        Sway: all
    test:
      targets: [SwayTests, SwayUITests]
  # 실기기 확인용(docs/LOCK_FIRST_PLAY.md). Debug의 --reset-fixture가 받아 둔 음원을 지우므로 Release로 묶고,
  # Release에서 빌드되지 않는 @testable 단위 시험(SwayTests)은 뺀다.
  SwayProbe:
    build:
      targets:
        Sway: all
    test:
      config: Release
      targets: [SwayUITests]
